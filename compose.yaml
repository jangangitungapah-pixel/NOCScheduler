services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nocscheduler
      POSTGRES_USER: nocscheduler
      POSTGRES_PASSWORD: nocscheduler
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocscheduler -d nocscheduler"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - nocscheduler-postgres:/var/lib/postgresql/data

volumes:
  nocscheduler-postgres:
