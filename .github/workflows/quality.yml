name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: F03 lint repair
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.18.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair unused import
        run: |
          sed -i 's/{ useMemo, useState }/{ useState }/' src/modules/product-surfaces/schedule-experiences.tsx
          pnpm exec prettier --write src/modules/product-surfaces/schedule-experiences.tsx

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair changes needed."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/product-surfaces/schedule-experiences.tsx
          git commit -m "fix: remove unused F03 interaction import"
          git push
