name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: F03 interaction repair
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.18.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair F03 interaction source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/modules/product-surfaces/schedule-experiences.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('import { useMemo, useState } from "react";', 'import { useState } from "react";');
          source = source.replace(
            /function TeamByEmployee\(\{ employeeId \}: \{ employeeId: string \}\) \{[\s\S]*?\n\}\n\nexport function TeamScheduleExperience/,
            `function TeamByEmployee({ employeeId }: { employeeId: string }) {
  const row = teamSchedule.find((item) => item.employeeId === employeeId) ?? teamSchedule[0]!;
  return (
    <div className="product-team-mobile-list">
      <ScheduleAgenda items={row.cells} />
    </div>
  );
}

export function TeamScheduleExperience`,
          );
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write src/modules/product-surfaces/schedule-experiences.tsx

      - name: Commit interaction repair
        run: |
          if git diff --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/product-surfaces/schedule-experiences.tsx
          git commit -m "fix: clean F03 schedule interactions"
          git push
