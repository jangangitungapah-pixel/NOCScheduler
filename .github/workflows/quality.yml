name: Quality

on:
  push:
    branches: [main]
  pull_request:

# Temporary write permission is used only while WP-F00 bootstraps the first
# reviewed lockfile. It is removed as soon as the lockfile is committed.
permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: F00 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.18.0
          install: false
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Static and application quality gates
        run: pnpm quality

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm e2e:smoke

      - name: Commit reviewed bootstrap lockfile
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is already tracked; frozen install was verified."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: commit pnpm lockfile"
          git push origin HEAD:main
