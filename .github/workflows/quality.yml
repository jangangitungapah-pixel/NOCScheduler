name: Quality

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: F04 database bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nocscheduler
          POSTGRES_USER: nocscheduler
          POSTGRES_PASSWORD: nocscheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocscheduler -d nocscheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nocscheduler:nocscheduler@localhost:5432/nocscheduler

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.18.0
          install: false
          cache: true

      - name: Install and lock F04 dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Canonical format
        run: pnpm format

      - name: Generate reviewed F04 migrations
        run: |
          rm -rf drizzle
          pnpm exec drizzle-kit generate --name=f04_domain_foundation
          sleep 1
          pnpm exec drizzle-kit generate --custom --name=f04_historical_guards
          CUSTOM_MIGRATION="$(find drizzle -type f -name '*.sql' | sort | tail -n 1)"
          test -n "$CUSTOM_MIGRATION"
          cp scripts/f04-historical-guards.sql "$CUSTOM_MIGRATION"
          pnpm exec prettier --write drizzle/meta/*.json
          pnpm db:check

      - name: Verify clean database install and contracts
        run: |
          pnpm db:reset:test
          pnpm db:migrate
          pnpm db:seed
          pnpm test:db

      - name: Static and application quality gates
        run: pnpm quality

      - name: Commit canonical F04 foundation
        run: |
          if git diff --quiet && git status --porcelain --untracked-files=all | grep -q '^$'; then
            echo "No generated changes found."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml compose.yaml drizzle.config.ts drizzle scripts src/db src/domain/core .env.example
          git commit -m "feat: establish WP-F04 database domain foundation"
          git push
