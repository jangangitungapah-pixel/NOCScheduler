name: Firebase Rebaseline Bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebaseline:
    name: F04R Firebase rebaseline bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.18.0
          install: false
          cache: true

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Refresh Firebase dependency lock
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical Firebase architecture documentation
        run: node scripts/firebase-rebaseline-docs.mjs

      - name: Canonical format
        run: >-
          pnpm exec prettier --write
          package.json pnpm-workspace.yaml firebase.json firestore.indexes.json apphosting.yaml
          vitest.firebase.config.ts src/firebase scripts/firebase-contract-test.ts tests/firebase
          README.md docs/prd docs/engineering/WP-F04_IMPLEMENTATION_NOTES.md
          docs/engineering/WP-F04R_FIREBASE_REBASELINE_NOTES.md
          docs/workplan/WORKPLAN_NOCScheduler_Fullstack_Implementation_Master_v1.md
          .github/workflows/quality.yml scripts/firebase-rebaseline-docs.mjs

      - name: Static and application quality gates
        run: pnpm quality

      - name: Firebase emulator contracts and Security Rules
        run: pnpm firebase:test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright regression
        run: pnpm e2e

      - name: Finalize F04R handoff and restore read-only CI
        run: |
          node scripts/firebase-rebaseline-docs.mjs --finalize
          pnpm format
          git rm -f scripts/firebase-rebaseline-docs.mjs

      - name: Commit canonical Firebase rebaseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete WP-F04R Firebase platform rebaseline"
          git push
