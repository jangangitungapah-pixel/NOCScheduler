name: Firebase Rebaseline Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    name: F04R Firebase rebaseline finalize
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.18.0
          install: false
          cache: true

      - name: Refresh Firebase dependency lock
        run: pnpm install --no-frozen-lockfile

      - name: Generate canonical Firebase rebaseline files
        run: |
          node scripts/firebase-rebaseline-docs.mjs
          pnpm format
          node scripts/firebase-rebaseline-docs.mjs --finalize
          pnpm format

      - name: Keep workflow unchanged for bot push
        run: |
          git restore --source=HEAD -- .github/workflows/quality.yml
          git rm -f scripts/firebase-rebaseline-docs.mjs

      - name: Commit canonical Firebase rebaseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete WP-F04R Firebase platform rebaseline"
          git push
