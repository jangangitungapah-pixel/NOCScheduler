name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: F03 team polish repair
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.18.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove redundant employee selector
        run: |
          python -c 'from pathlib import Path; p=Path("src/modules/product-surfaces/schedule-experiences.tsx"); s=p.read_text(); old="      <label className=\"product-inline-select\">\n        Employee\n        <select value={row.employeeId} onChange={() => undefined}>\n          <option value={row.employeeId}>{row.employeeName}</option>\n        </select>\n      </label>\n"; assert old in s; p.write_text(s.replace(old, "", 1))'
          pnpm exec prettier --write src/modules/product-surfaces/schedule-experiences.tsx

      - name: Commit team polish
        run: |
          if git diff --quiet; then
            echo "No polish changes needed."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/product-surfaces/schedule-experiences.tsx
          git commit -m "fix: remove redundant F03 team employee selector"
          git push
