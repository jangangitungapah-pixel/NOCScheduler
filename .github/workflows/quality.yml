name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: F04 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nocscheduler
          POSTGRES_USER: nocscheduler
          POSTGRES_PASSWORD: nocscheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocscheduler -d nocscheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nocscheduler:nocscheduler@localhost:5432/nocscheduler

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.18.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static and application quality gates
        run: pnpm quality

      - name: Validate migration journal
        run: pnpm db:check

      - name: Verify clean database install and contracts
        run: |
          pnpm db:reset:test
          pnpm db:migrate
          pnpm db:seed
          pnpm test:db

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright regression
        run: pnpm e2e
