name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: F01 formatter gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.18.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format F01 acceptance test
        run: pnpm exec prettier --write tests/e2e/design-system.spec.ts

      - name: Commit canonical test formatting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/design-system.spec.ts
          git commit -m "chore: format F01 acceptance test"
          git push

      - name: Static and application quality gates
        run: pnpm quality

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright F01 acceptance
        run: pnpm e2e
