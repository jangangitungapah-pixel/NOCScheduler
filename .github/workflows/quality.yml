name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: F00 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Static and application quality gates
        run: pnpm quality

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm e2e:smoke

      - name: Upload generated lockfile for bootstrap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f00-pnpm-lock-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
